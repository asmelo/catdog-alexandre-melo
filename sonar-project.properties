sonar.projectKey=catdog-alexandre-melo
sonar.projectName=catdog-alexandre-melo
sonar.host.url=http://sonar.anymarket.vpc:9000

# O corpo do e-mail e as mensagens de erro sao PT-BR acentuado.
sonar.sourceEncoding=UTF-8

# Escopo da analise. Sem isto o scanner assume `.` e a configuracao deixa de
# ser reproduzivel: cada execucao depende das flags -D passadas na linha de
# comando, e uma analise feita pelo CI divergiria da feita na maquina do dev.
sonar.sources=services/backend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# --------------------------------------------------------------------------
# HTML de e-mail: as 4 regras abaixo do perfil web pedem o OPOSTO do que um
# cliente de e-mail exige. Sao ignoradas APENAS nos templates de e-mail, e
# apenas elas — o resto do perfil continua valendo sobre esses arquivos, que
# e justamente onde um `<script>` ou uma interpolacao sem escape seria mais
# perigosa. Excluir os arquivos inteiros cegaria essa vigilancia.
# --------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=email1,email2,email3,email4

# S1827 — "atributos de apresentacao depreciados". `bgcolor`, `align`, `valign`
# e `width` em tabela sao obrigatorios: a engine do Word no Outlook ignora os
# equivalentes em CSS.
sonar.issue.ignore.multicriteria.email1.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.email1.resourceKey=**/infra/mail/templates/**/*.html

# S5257 — "nao use tabela para layout". Layout em tabela e a unica tecnica com
# suporte amplo em cliente de e-mail; `flex` e `grid` nao funcionam.
sonar.issue.ignore.multicriteria.email2.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.email2.resourceKey=**/infra/mail/templates/**/*.html

# S6819 — "prefira HTML semantico a role=presentation". E consequencia direta
# da regra acima: a tabela de layout precisa ser marcada como apresentacao
# para nao ser anunciada como tabela de dados por leitor de tela.
sonar.issue.ignore.multicriteria.email3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.email3.resourceKey=**/infra/mail/templates/**/*.html

# S5725 — "recurso externo sem integrity". SRI nao e suportado por cliente de
# e-mail, e o <link> da fonte e exigido pela task para Apple Mail/Thunderbird.
sonar.issue.ignore.multicriteria.email4.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.email4.resourceKey=**/infra/mail/templates/**/*.html
