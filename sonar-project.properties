sonar.projectKey=catdog-alexandre-melo
sonar.projectName=catdog-alexandre-melo
sonar.host.url=http://sonar.anymarket.vpc:9000

# O corpo do e-mail e as mensagens de erro sao PT-BR acentuado.
sonar.sourceEncoding=UTF-8

# Escopo da analise. Sem isto o scanner assume `.` e a configuracao deixa de
# ser reproduzivel: cada execucao depende das flags -D passadas na linha de
# comando, e uma analise feita pelo CI divergiria da feita na maquina do dev.
# `index.html` entra explicitamente: ele fica na RAIZ do servico, entao
# `services/frontend/src` sozinho o deixaria fora da analise.
sonar.sources=services/backend/src,services/frontend/src,services/frontend/index.html
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/prisma/migrations/**

# --------------------------------------------------------------------------
# Testes e cobertura (TASK-BACKEND-007).
#
# `sonar.tests` e obrigatorio para o Sonar classificar os arquivos como codigo
# de TESTE: sem isso, um `.spec.ts` que caisse dentro de `sonar.sources` seria
# medido como codigo de producao (com regras que nao fazem sentido em teste) e
# ainda entraria no denominador da cobertura, afundando a metrica.
#
# Os tres specs unitarios dos services vivem DENTRO de `src/` (tabela *Files*
# da task), e nao em `tests/`. E por isso que `sonar.test.inclusions` existe:
# ela e o filtro que retira do escopo de `sonar.sources` tudo que casa
# `**/*.spec.ts`, mantendo os dois lados coerentes.
# --------------------------------------------------------------------------
#
# So o backend e declarado, pelo MESMO motivo que `sonar.sources` acima tambem
# so lista o backend: `services/frontend/` esta vazio, e o scanner ABORTA
# ("The folder ... does not exist") quando um caminho de `sonar.sources`/
# `sonar.tests` nao existe. O plano da task prescrevia declarar os dois desde
# ja; aqui isso valeria uma analise que nunca roda. A TASK-FRONTEND-013
# acrescenta `services/frontend/tests` junto com os arquivos dele.
# Os 12 specs do frontend vivem DENTRO de `src/` (tabela Files da
# TASK-FRONTEND-013), e nao em `tests/`. Quem os classifica como teste e o
# `sonar.test.inclusions` abaixo, que filtra `**/*.spec.ts(x)` para fora de
# `sonar.sources`. Os dois diretorios `tests/` entram para os utilitarios de
# suporte (setup, mocks, harness).
sonar.tests=services/backend/tests,services/frontend/tests
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

# Relatorio de cobertura no formato LCOV, gerado por `npm run test:cov`
# (`coverageReporters: ['text', 'lcov']` no jest.config.ts). Os dois caminhos
# ja sao declarados aqui para nao ser preciso reabrir este arquivo na
# TASK-FRONTEND-013; o Sonar ignora, com um aviso, o relatorio ausente.
sonar.javascript.lcov.reportPaths=services/backend/coverage/lcov.info,services/frontend/coverage/lcov.info

# --------------------------------------------------------------------------
# HTML de e-mail: as 4 regras abaixo do perfil web pedem o OPOSTO do que um
# cliente de e-mail exige. Sao ignoradas APENAS nos templates de e-mail, e
# apenas elas — o resto do perfil continua valendo sobre esses arquivos, que
# e justamente onde um `<script>` ou uma interpolacao sem escape seria mais
# perigosa. Excluir os arquivos inteiros cegaria essa vigilancia.
# --------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=email1,email2,email3,email4

# S1827 — "atributos de apresentacao depreciados". `bgcolor`, `align`, `valign`
# e `width` em tabela sao obrigatorios: a engine do Word no Outlook ignora os
# equivalentes em CSS.
sonar.issue.ignore.multicriteria.email1.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.email1.resourceKey=**/infra/mail/templates/**/*.html

# S5257 — "nao use tabela para layout". Layout em tabela e a unica tecnica com
# suporte amplo em cliente de e-mail; `flex` e `grid` nao funcionam.
sonar.issue.ignore.multicriteria.email2.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.email2.resourceKey=**/infra/mail/templates/**/*.html

# S6819 — "prefira HTML semantico a role=presentation". E consequencia direta
# da regra acima: a tabela de layout precisa ser marcada como apresentacao
# para nao ser anunciada como tabela de dados por leitor de tela.
sonar.issue.ignore.multicriteria.email3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.email3.resourceKey=**/infra/mail/templates/**/*.html

# S5725 — "recurso externo sem integrity". SRI nao e suportado por cliente de
# e-mail, e o <link> da fonte e exigido pela task para Apple Mail/Thunderbird.
sonar.issue.ignore.multicriteria.email4.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.email4.resourceKey=**/infra/mail/templates/**/*.html
